services:
  db:
    image: postgres:16-alpine
    container_name: offers-local-db
    environment:
      POSTGRES_USER: offers
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: offers
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offers -d offers"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [offersnet]

  # Заглушка auth-service: отдаёт карту ролей, чтобы проверить права по-настоящему.
  auth-stub:
    image: node:22-alpine
    container_name: offers-local-auth-stub
    working_dir: /app
    command: node auth-stub.mjs
    environment:
      OFFERS_SERVICE_SECRET: test-service-secret
      AUTH_STUB_ROLES: owner@tn.ru=superadmin,manager@tn.ru=editor
    volumes:
      - ./scripts:/app:ro
    networks: [offersnet]

  offers:
    build: ./offers-service
    container_name: offers-local-app
    environment:
      DATABASE_URL: postgres://offers:testpass@db:5432/offers?sslmode=disable
      PORT: "3000"
      OFFERS_APP_ID: offers
      OFFERS_SERVICE_SECRET: test-service-secret
      OFFERS_BOT_SECRET: test-bot-secret
      OFFERS_OWNER_EMAIL: owner@tn.ru
      AUTH_SERVICE_URL: http://auth-stub:13001
      # Локальный стенд без S3: экспорт DOCX идёт байтами и хранилище не нужно.
      S3_ENDPOINT: ""
      S3_ACCESS_KEY: x
      S3_SECRET_KEY: y
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "2525"
    depends_on:
      db:
        condition: service_healthy
      auth-stub:
        condition: service_started
    ports:
      - "18080:3000"
    networks: [offersnet]

networks:
  offersnet: