openapi: 3.0.3
info:
  title: offers-service (LogicTEAM.КП)
  version: 0.1.0
  description: |
    Коммерческие предложения: каталог систем и материалов, форма КП,
    сборка предложений, экспорт DOCX, доступ к Telegram-боту.

    Авторизация плагина — JWT `app_id=offers` (заголовок `Authorization: Bearer`).
    Ручки `/api/offers/bot/*` вызываются только сервисом бота с заголовком
    `X-Service-Secret` и JWT не требуют.
paths:
  /api/offers/health:
    get:
      summary: Состояние сервиса
      security: []
      responses:
        '200':
          description: Сервис жив
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /api/offers/docs/:
    get:
      summary: Страница Swagger UI
      security: []
      responses:
        '200':
          description: HTML-страница
  /api/offers/openapi.yaml:
    get:
      summary: Схема OpenAPI
      security: []
      responses:
        '200':
          description: YAML-схема

  /api/offers/permissions/me:
    get:
      summary: Роль текущего пользователя
      responses:
        '200':
          description: Роль и признак доступа
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                  role:
                    type: string
                    enum: ['', viewer, editor, admin]
                  hasAccess:
                    type: boolean
  /api/offers/permissions/list:
    get:
      summary: Все глобальные роли (admin)
      responses:
        '200':
          description: Список ролей
  /api/offers/permissions/set:
    post:
      summary: Установить роль (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                role:
                  type: string
                  enum: ['', viewer, editor, admin]
      responses:
        '200':
          description: Роль сохранена

  /api/offers/catalog:
    get:
      summary: Список карточек каталога
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Поиск по названию и описанию
        - name: archived
          in: query
          schema:
            type: string
            enum: ['1']
          description: '1 — включить архивные'
      responses:
        '200':
          description: Карточки
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogItem'
    post:
      summary: Создать карточку (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogItem'
      responses:
        '200':
          description: Созданная карточка
  /api/offers/catalog/{id}:
    put:
      summary: Изменить карточку (admin)
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogItem'
      responses:
        '200':
          description: Обновлённая карточка
    delete:
      summary: Убрать карточку в архив (admin)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Карточка в архиве

  /api/offers/form:
    get:
      summary: Форма КП
      parameters:
        - name: mode
          in: query
          schema:
            type: string
            default: client
      responses:
        '200':
          description: Форма
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferForm'
    put:
      summary: Сохранить форму КП (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferForm'
      responses:
        '200':
          description: Сохранённая форма

  /api/offers/context/cards:
    get:
      summary: Карточки систем из Базы знаний
      description: |
        Список карточек с тегом `commercial_propose` из кеша. Источник правды —
        заметки в Базе знаний; кеш нужен, чтобы экран открывался без похода в
        базу. Обновление — отдельной ручкой.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Карточки и признак «база знаний настроена»
          content:
            application/json:
              schema:
                type: object
                properties:
                  kbEnabled:
                    type: boolean
                  cards:
                    type: array
                    items:
                      $ref: '#/components/schemas/SystemCard'
  /api/offers/context/refresh:
    post:
      summary: Перечитать карточки из Базы знаний
      description: |
        Читает заметки с тегом `commercial_propose` и обновляет кеш. При ошибке
        Базы знаний возвращает прежние карточки и поле `error` — раздел не
        становится пустым из-за временного сбоя.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Обновлённый список (возможно, с полем error)
          content:
            application/json:
              schema:
                type: object
                properties:
                  kbEnabled:
                    type: boolean
                  count:
                    type: integer
                  error:
                    type: string
                  cards:
                    type: array
                    items:
                      $ref: '#/components/schemas/SystemCard'
  /api/offers/offers:
    get:
      summary: Список предложений (видны свои; admin — все)
      responses:
        '200':
          description: Предложения
          content:
            application/json:
              schema:
                type: object
                properties:
                  offers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Offer'
    post:
      summary: Создать предложение (editor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Offer'
      responses:
        '200':
          description: Созданное предложение
  /api/offers/offers/{id}:
    get:
      summary: Получить предложение
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Предложение
        '403':
          description: Нет доступа
    put:
      summary: Изменить предложение (editor; своё)
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Offer'
      responses:
        '200':
          description: Обновлённое предложение
    delete:
      summary: Удалить предложение
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Удалено
  /api/offers/offers/{id}/export:
    post:
      summary: Экспорт в DOCX
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: format
          in: query
          schema:
            type: string
            enum: [docx]
      responses:
        '200':
          description: Файл DOCX
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        '400':
          description: Предложение пустое или форма с дефектом
  /api/offers/offers/{id}/link:
    post:
      summary: Временная ссылка на DOCX (~48 часов)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Ссылка
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  expiresAt:
                    type: string

  /api/offers/offers/{id}/brief:
    get:
      summary: Бриф предложения
      description: |
        Бриф вместе с историей разговора в боте. Брифа нет — отдаётся пустой
        бриф со статусом `absent`: для плагина это обычное состояние, а не ошибка.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Бриф и реплики
          content:
            application/json:
              schema:
                type: object
                properties:
                  brief:
                    type: object
                  turns:
                    type: array
                    items:
                      type: object
        '403':
          description: Нет доступа к предложению
        '404':
          description: Предложение не найдено
    put:
      summary: Правка брифа (владелец предложения или admin)
      description: |
        Заменяет ответы брифа целиком и двигает `updated_at`. Роль editor сама
        по себе чужой бриф не правит: бриф — это разговор владельца КП.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                payload:
                  type: object
                status:
                  type: string
                  enum: [open, ready, agreed]
      responses:
        '200':
          description: Сохранённый бриф
          content:
            application/json:
              schema:
                type: object
                properties:
                  brief:
                    type: object
                  turns:
                    type: array
                    items:
                      type: object
        '400':
          description: Неверное тело запроса
        '403':
          description: Правит не владелец и не admin
        '404':
          description: Предложение не найдено

  /api/offers/access/list:
    get:
      summary: Кто вошёл в бота (admin)
      responses:
        '200':
          description: Список
  /api/offers/access/role:
    post:
      summary: Назначить роль вошедшему (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email:
                  type: string
                role:
                  type: string
                  enum: [viewer, editor, admin]
      responses:
        '200':
          description: Роль сохранена
  /api/offers/access/codes:
    post:
      summary: Выдать код входа (admin, действует 7 дней)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
      responses:
        '200':
          description: Код
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  expiresAt:
                    type: string

  # Токен Telegram-бота (2026-10-29). Один хозяин: таблица offers_bot_config.
  # Плагину токен наружу не отдаётся — только «задан ли» и чей это бот.
  /api/offers/bot/config:
    get:
      summary: Настройки бота — задан ли токен (admin)
      responses:
        '200':
          description: Настройки
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured:
                    type: boolean
                  botUsername:
                    type: string
                  updatedBy:
                    type: string
                  updatedAt:
                    type: string
    post:
      summary: Проверить токен через бота и сохранить (admin)
      description: >-
        Токен проверяется getMe через offers-bot (с сервера Telegram недоступен),
        и только потом записывается. Неверный токен рабочий не заменяет.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Токен сохранён
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured:
                    type: boolean
                  botUsername:
                    type: string
                  updatedBy:
                    type: string
                  updatedAt:
                    type: string
        '400':
          description: Токен пуст, не по форме или отвергнут Telegram
        '503':
          description: Бот недоступен — проверить токен негде, ничего не сохранено
    delete:
      summary: Удалить токен — бот перестаёт принимать сообщения (admin)
      responses:
        '200':
          description: Токен удалён
  /api/offers/bot/status:
    get:
      summary: Работает ли бот сейчас (admin)
      responses:
        '200':
          description: Состояние
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured:
                    type: boolean
                  running:
                    type: boolean
                  botUsername:
                    type: string
                  lastError:
                    type: string
                  checkedAt:
                    type: string
  /api/offers/bot/token:
    get:
      summary: Действующий токен бота (только offers-bot)
      security:
        - serviceSecret: []
      responses:
        '200':
          description: Токен; пустая строка — администратор ещё не вводил
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  username:
                    type: string
  /api/offers/bot/heartbeat:
    post:
      summary: Отметка «бот жив» и последняя ошибка (только offers-bot)
      security:
        - serviceSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                last_error:
                  type: string
      responses:
        '200':
          description: Отмечено
  /api/offers/bot/request-code:
    post:
      summary: Самозапрос кода на e-mail (без JWT, только сервис бота)
      security:
        - serviceSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                chat_id:
                  type: string
      responses:
        '200':
          description: Код отправлен на почту
        '503':
          description: Письмо не удалось отправить
  /api/offers/bot/verify-code:
    post:
      summary: Проверить код и привязать chat_id
      security:
        - serviceSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chat_id, email, code]
              properties:
                chat_id:
                  type: string
                email:
                  type: string
                code:
                  type: string
      responses:
        '200':
          description: Вход выполнен
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                  role:
                    type: string
  /api/offers/bot/identity:
    get:
      summary: Кто привязан к chat_id
      security:
        - serviceSecret: []
      parameters:
        - name: chat_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Личность
        '404':
          description: chat_id не привязан
  /api/offers/bot/catalog:
    get:
      summary: Каталог для бота
      security:
        - serviceSecret: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Карточки
  /api/offers/bot/offers:
    get:
      summary: Предложения привязанного к чату человека
      security:
        - serviceSecret: []
      parameters:
        - name: chat_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Список предложений
    post:
      summary: Создать черновик предложения из бота
      security:
        - serviceSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chat_id, items]
              properties:
                chat_id:
                  type: string
                client:
                  $ref: '#/components/schemas/OfferClient'
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/OfferItem'
                formValues:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        '200':
          description: Черновик создан
  /api/offers/bot/offers/{id}:
    patch:
      summary: Изменить состав черновика из бота
      security:
        - serviceSecret: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Обновлённый черновик
  /api/offers/bot/offers/{id}/docx:
    post:
      summary: Получить DOCX (base64) для отправки в чат
      security:
        - serviceSecret: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: chat_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Документ в base64
          content:
            application/json:
              schema:
                type: object
                properties:
                  docx_base64:
                    type: string
                  file_name:
                    type: string
  /api/offers/bot/offers/{id}/brief/start:
    post:
      summary: Начать бриф-диалог (бот)
      description: |
        Создаёт бриф предложения (идемпотентно) и возвращает первый вопрос.
        Вопросы задаёт llm-service; ручка только оркестрация.
      security:
        - serviceSecret: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: chat_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Бриф и первый вопрос
          content:
            application/json:
              schema:
                type: object
                properties:
                  brief:
                    type: object
                  reply:
                    type: string
                  done:
                    type: boolean
                  owner:
                    type: string
        '403':
          description: Предложение принадлежит другому человеку
        '404':
          description: Предложение не найдено
  /api/offers/bot/offers/{id}/brief/step:
    post:
      summary: Шаг бриф-диалога (бот)
      description: |
        Отправляет реплику менеджера модели, сохраняет обновлённый бриф и
        возвращает следующий вопрос. При недоступности модели бриф не меняется.
      security:
        - serviceSecret: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chat_id, text]
              properties:
                chat_id:
                  type: string
                text:
                  type: string
      responses:
        '200':
          description: Обновлённый бриф и ответ менеджеру
          content:
            application/json:
              schema:
                type: object
                properties:
                  brief:
                    type: object
                  reply:
                    type: string
                  done:
                    type: boolean
                  nextTopic:
                    type: string
                  retry:
                    type: boolean
                  unavailable:
                    type: boolean
                  skipped:
                    type: array
                    items:
                      type: string
        '400':
          description: Неверное тело запроса
        '403':
          description: Предложение принадлежит другому человеку
  /api/offers/bot/offers/{id}/brief:
    get:
      summary: Бриф предложения (бот)
      description: |
        Отдаёт бриф для сводки в чате: сессия бота хранит только текущую тему,
        а ответы менеджера лежат в брифе и нигде больше не дублируются.
      security:
        - serviceSecret: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: chat_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Бриф предложения
          content:
            application/json:
              schema:
                type: object
                properties:
                  brief:
                    type: object
        '400':
          description: Неверный идентификатор
        '403':
          description: Предложение принадлежит другому человеку
        '404':
          description: Брифа ещё нет
  /api/offers/bot/offers/{id}/copy/{key}:
    post:
      summary: Текст секции КП (бот)
      description: |
        Одно действие на три: `write` — модель пишет секцию, `edit` —
        вычитывает присланный менеджером текст, `accept` — сохраняет
        согласованный текст в предложении. При недоступности модели `write`
        возвращает пустой текст, `edit` — текст менеджера: КП собирается без
        написанной секции, но с правкой человека.
      security:
        - serviceSecret: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: key
          in: path
          required: true
          description: intro | system | advantages | conditions
          schema:
            type: string
            enum: [intro, system, advantages, conditions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chat_id, action]
              properties:
                chat_id:
                  type: string
                action:
                  type: string
                  enum: [write, edit, accept]
                text:
                  type: string
                systemIndex:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Текст секции или подтверждение принятия
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                  text:
                    type: string
                  warnings:
                    type: array
                    items:
                      type: string
                  label:
                    type: string
                  accepted:
                    type: boolean
        '400':
          description: Неизвестная секция или неверное действие
        '403':
          description: Предложение принадлежит другому человеку
  /api/offers/bot/offers/{id}/attach:
    post:
      summary: Принять файл к КП (бот)
      description: |
        Разбирает присланный в чат файл и возвращает «что понял». Ничего не
        применяется: подтверждение — отдельной ручкой `attach/apply`.

        Тип определяется по сигнатуре, а не по имени файла: `.md` и `.xlsx`
        принимаются, `.docx` и старый `.xls` — с понятным отказом. Тело
        запроса — сами байты файла, имя — в `file_name` или заголовке
        `X-File-Name`. Предел размера — 10 МБ.

        `.md` раскладывается по полям брифа; `.xlsx` распознаётся как
        спецификация, если в нём есть колонки «наименование» и «количество»,
        и сверяется с каталогом по наименованию.
      security:
        - serviceSecret: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: chat_id
          in: query
          required: true
          schema:
            type: string
        - name: file_name
          in: query
          description: Имя файла, как его видел человек
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Что бот понял из файла
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind:
                    type: string
                    enum: [md, xlsx, docx, xls, pdf, '']
                  name:
                    type: string
                  key:
                    type: string
                    description: Ключ вложения в хранилище (пусто, если хранилище не настроено)
                  reply:
                    type: string
                  needsConfirm:
                    type: boolean
                  brief:
                    type: object
                    description: Разбор текстового файла
                    properties:
                      fields:
                        type: object
                        additionalProperties:
                          type: array
                          items:
                            type: string
                      notes:
                        type: string
                      summary:
                        type: array
                        items:
                          type: string
                  spec:
                    type: object
                    description: Разобранная таблица спецификации
                    properties:
                      rows:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            unit:
                              type: string
                            qty:
                              type: number
                            price:
                              type: number
                            sum:
                              type: number
                            catalogId:
                              type: integer
                            hasCatalog:
                              type: boolean
                            priceDiff:
                              type: boolean
                      matched:
                        type: integer
                      new:
                        type: integer
                      priceDiffs:
                        type: integer
                      warnings:
                        type: array
                        items:
                          type: string
                      summary:
                        type: string
                  context:
                    type: array
                    description: Строки таблицы, когда это контекст, а не состав
                    items:
                      type: string
        '400':
          description: Формат не принят (docx, xls, pdf, незнакомый файл)
        '403':
          description: Предложение принадлежит другому человеку
        '413':
          description: Файл больше 10 МБ
  /api/offers/bot/offers/{id}/attach/apply:
    post:
      summary: Применить подтверждённый разбор файла (бот)
      description: |
        `brief` дописывает поля в бриф (пустое не затирает известное, списки
        объединяются без повторов), `spec` заменяет состав предложения.
        Цены для позиций, найденных в каталоге, берутся из каталога: файл от
        заказчика — черновик, и печатать в КП его цены нельзя.
      security:
        - serviceSecret: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chat_id, mode]
              properties:
                chat_id:
                  type: string
                mode:
                  type: string
                  enum: [brief, spec]
                brief:
                  type: object
                  description: Разбор файла из ответа attach
                spec:
                  type: object
                  description: Разбор таблицы из ответа attach
      responses:
        '200':
          description: Что применилось
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    type: string
                  applied:
                    type: boolean
        '400':
          description: Нет разбора или в таблице нет позиций
        '403':
          description: Предложение принадлежит другому человеку
  /api/offers/bot/offers/{id}/link:
    post:
      summary: Временная ссылка на DOCX для бота
      security:
        - serviceSecret: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: chat_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Ссылка
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceSecret:
      type: apiKey
      in: header
      name: X-Service-Secret
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    SystemCard:
      type: object
      description: Карточка системы из Базы знаний (заметка с тегом commercial_propose).
      properties:
        noteId:
          type: integer
          format: int64
        path:
          type: string
        sku:
          type: string
          description: Код системы из system_sku; по нему связь с каталогом.
        title:
          type: string
        description:
          type: string
        composition:
          type: array
          items:
            type: string
        specifications:
          type: array
          items:
            type: array
            items:
              type: string
        imageName:
          type: string
        catalogId:
          type: integer
          format: int64
          description: 0 — карточка не связана с каталогом.
        updatedAt:
          type: string
        hasDescription:
          type: boolean
        hasComposition:
          type: boolean
        empty:
          type: boolean
    CatalogItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum: [system, material, work]
        name:
          type: string
        unit:
          type: string
        basePrice:
          type: number
        description:
          type: string
        sortOrder:
          type: integer
        archived:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
    Placeholder:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
    Block:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: array
          description: Узлы (абзац, заголовок, список, таблица)
          items:
            type: object
        showInClient:
          type: boolean
        showInInternal:
          type: boolean
    OfferForm:
      type: object
      properties:
        id:
          type: integer
          format: int64
        mode:
          type: string
        title:
          type: string
        placeholders:
          type: array
          items:
            $ref: '#/components/schemas/Placeholder'
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/Block'
        requiredFields:
          type: array
          items:
            type: string
        updatedAt:
          type: string
    OfferClient:
      type: object
      properties:
        name:
          type: string
        contact:
          type: string
    OfferItem:
      type: object
      properties:
        catalogId:
          type: integer
          format: int64
          nullable: true
        name:
          type: string
        unit:
          type: string
        qty:
          type: number
        price:
          type: number
        sum:
          type: number
    Offer:
      type: object
      properties:
        id:
          type: integer
          format: int64
        number:
          type: string
          example: 007/2026
        ownerEmail:
          type: string
        client:
          $ref: '#/components/schemas/OfferClient'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OfferItem'
        formValues:
          type: object
          additionalProperties:
            type: string
        total:
          type: number
        status:
          type: string
          enum: [draft, final]
        docxKey:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
security:
  - bearerAuth: []
